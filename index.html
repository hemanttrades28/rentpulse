<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RentPulse - Cloud Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen text-gray-800">

  <!-- AUTH SECTION (Login / Sign Up) -->
  <div id="authSection" class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-extrabold text-blue-600">RentPulse</h1>
        <p class="text-gray-500 text-sm mt-1" id="authSubtitle">Cloud-synced Property Management</p>
      </div>

      <form id="authForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">Email</label>
          <input type="email" id="authEmail" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="owner@rentpulse.com">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">Password</label>
          <input type="password" id="authPassword" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="••••••••">
        </div>

        <p id="authError" class="text-red-500 text-xs hidden"></p>

        <button type="submit" id="authBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg transition duration-200">
          Sign In
        </button>
      </form>

      <div class="text-center mt-6">
        <button id="toggleAuthMode" class="text-xs text-blue-600 hover:underline focus:outline-none">
          Don't have an account? Sign Up
        </button>
      </div>
    </div>
  </div>

  <!-- MAIN DASHBOARD (Only visible after login) -->
  <div id="dashboardSection" class="hidden min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-white border-b px-6 py-4 flex justify-between items-center sticky top-0 z-10">
      <div class="flex items-center gap-3">
        <h1 class="text-xl font-bold text-blue-600">RentPulse</h1>
        <span class="bg-green-100 text-green-700 text-xs font-medium px-2.5 py-0.5 rounded-full flex items-center gap-1">
          <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> Cloud Live
        </span>
      </div>
      <div class="flex items-center gap-4">
        <span id="userEmailDisplay" class="text-xs text-gray-500 font-medium hidden sm:inline"></span>
        <button id="logoutBtn" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-1.5 px-3 rounded-md transition">
          Logout
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-4 md:p-8 max-w-5xl w-full mx-auto space-y-6">
      
      <!-- Stats / Action Bar -->
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
        <div>
          <h2 class="text-lg font-bold text-gray-800">Tenant Directory</h2>
          <p class="text-xs text-gray-500">Changes here automatically sync to all your devices</p>
        </div>
        <button id="openModalBtn" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition flex items-center justify-center gap-2">
          <span>+</span> Add Tenant
        </button>
      </div>

      <!-- Tenants Table -->
      <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="bg-gray-50 text-gray-500 uppercase text-xs border-b">
              <tr>
                <th class="py-3 px-4">Name</th>
                <th class="py-3 px-4">Property / Room</th>
                <th class="py-3 px-4">Rent ($)</th>
                <th class="py-3 px-4">Status</th>
                <th class="py-3 px-4 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="tenantTableBody" class="divide-y divide-gray-100">
              <tr>
                <td colspan="5" class="text-center py-8 text-gray-400">Loading data from cloud...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- ADD TENANT MODAL -->
  <div id="tenantModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-2xl space-y-4">
      <h3 class="text-lg font-bold text-gray-800">Add New Tenant</h3>
      <form id="tenantForm" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Tenant Name</label>
          <input type="text" id="tenantName" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Property / Unit</label>
          <input type="text" id="tenantUnit" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm" placeholder="Apt 4B">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Monthly Rent ($)</label>
          <input type="number" id="tenantRent" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Status</label>
          <select id="tenantStatus" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
            <option value="Paid">Paid</option>
            <option value="Pending">Pending</option>
            <option value="Overdue">Overdue</option>
          </select>
        </div>
        <div class="flex gap-2 pt-2">
          <button type="button" id="closeModalBtn" class="w-1/2 bg-gray-100 hover:bg-gray-200 text-gray-700 py-2 rounded-lg text-sm font-semibold">Cancel</button>
          <button type="submit" class="w-1/2 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg text-sm font-semibold">Save to Cloud</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // 1. Firebase Configuration (Your keys applied)
    const firebaseConfig = {
      apiKey: "AIzaSyAKPpc0loQCoXWm_xJP26XZ8G09Ctfor9k",
      authDomain: "rentpulse-2026.firebaseapp.com",
      projectId: "rentpulse-2026",
      storageBucket: "rentpulse-2026.firebasestorage.app",
      messagingSenderId: "71328800274",
      appId: "1:71328800274:web:6426421c6415a4a87df403"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // DOM Elements
    const authSection = document.getElementById('authSection');
    const dashboardSection = document.getElementById('dashboardSection');
    const authForm = document.getElementById('authForm');
    const authEmail = document.getElementById('authEmail');
    const authPassword = document.getElementById('authPassword');
    const authBtn = document.getElementById('authBtn');
    const authError = document.getElementById('authError');
    const toggleAuthMode = document.getElementById('toggleAuthMode');
    const authSubtitle = document.getElementById('authSubtitle');
    const userEmailDisplay = document.getElementById('userEmailDisplay');
    const logoutBtn = document.getElementById('logoutBtn');
    const tenantTableBody = document.getElementById('tenantTableBody');
    const tenantModal = document.getElementById('tenantModal');
    const openModalBtn = document.getElementById('openModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const tenantForm = document.getElementById('tenantForm');

    let isSignUpMode = false;
    let currentUser = null;
    let unsubscribeSnapshot = null;

    // Toggle Sign In / Sign Up
    toggleAuthMode.addEventListener('click', () => {
      isSignUpMode = !isSignUpMode;
      authBtn.innerText = isSignUpMode ? 'Sign Up' : 'Sign In';
      toggleAuthMode.innerText = isSignUpMode ? 'Already have an account? Sign In' : "Don't have an account? Sign Up";
      authSubtitle.innerText = isSignUpMode ? 'Create a new account' : 'Cloud-synced Property Management';
      authError.classList.add('hidden');
    });

    // Handle Authentication Form Submit
    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      authError.classList.add('hidden');
      const email = authEmail.value;
      const password = authPassword.value;

      try {
        if (isSignUpMode) {
          await auth.createUserWithEmailAndPassword(email, password);
        } else {
          await auth.signInWithEmailAndPassword(email, password);
        }
      } catch (err) {
        authError.innerText = err.message;
        authError.classList.remove('hidden');
      }
    });

    // Logout
    logoutBtn.addEventListener('click', () => auth.signOut());

    // Auth State Listener
    auth.onAuthStateChanged((user) => {
      if (user) {
        currentUser = user;
        userEmailDisplay.innerText = user.email;
        authSection.classList.add('hidden');
        dashboardSection.classList.remove('hidden');
        listenToCloudData();
      } else {
        currentUser = null;
        if (unsubscribeSnapshot) unsubscribeSnapshot();
        dashboardSection.classList.add('hidden');
        authSection.classList.remove('hidden');
      }
    });

    // Real-Time Cloud Listener (Syncs across mobile & laptop)
    function listenToCloudData() {
      if (!currentUser) return;

      const userTenantsRef = db.collection('users').doc(currentUser.uid).collection('tenants');

      unsubscribeSnapshot = userTenantsRef.onSnapshot((snapshot) => {
        tenantTableBody.innerHTML = '';
        if (snapshot.empty) {
          tenantTableBody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-gray-400">No tenants added yet. Click "+ Add Tenant" to create one.</td></tr>`;
          return;
        }

        snapshot.forEach((doc) => {
          const tenant = doc.data();
          const tr = document.createElement('tr');
          tr.className = "hover:bg-gray-50 transition border-b";
          tr.innerHTML = `
            <td class="py-3 px-4 font-semibold text-gray-800">${tenant.name}</td>
            <td class="py-3 px-4 text-gray-600">${tenant.unit}</td>
            <td class="py-3 px-4 font-mono">${tenant.rent}</td>
            <td class="py-3 px-4">
              <span class="px-2.5 py-1 text-xs font-semibold rounded-full ${getStatusBadge(tenant.status)}">
                ${tenant.status}
              </span>
            </td>
            <td class="py-3 px-4 text-right">
              <button onclick="deleteTenant('${doc.id}')" class="text-red-500 hover:text-red-700 text-xs font-semibold">Delete</button>
            </td>
          `;
          tenantTableBody.appendChild(tr);
        });
      });
    }

    function getStatusBadge(status) {
      if (status === 'Paid') return 'bg-green-100 text-green-700';
      if (status === 'Pending') return 'bg-yellow-100 text-yellow-700';
      return 'bg-red-100 text-red-700';
    }

    // Modal Control
    openModalBtn.addEventListener('click', () => tenantModal.classList.remove('hidden'));
    closeModalBtn.addEventListener('click', () => tenantModal.classList.add('hidden'));

    // Add New Tenant to Firestore Cloud
    tenantForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentUser) return;

      const newTenant = {
        name: document.getElementById('tenantName').value,
        unit: document.getElementById('tenantUnit').value,
        rent: Number(document.getElementById('tenantRent').value),
        status: document.getElementById('tenantStatus').value,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      try {
        await db.collection('users').doc(currentUser.uid).collection('tenants').add(newTenant);
        tenantForm.reset();
        tenantModal.classList.add('hidden');
      } catch (err) {
        alert("Error saving: " + err.message);
      }
    });

    // Delete Tenant from Cloud
    async function deleteTenant(id) {
      if (!currentUser || !confirm("Delete this tenant record?")) return;
      try {
        await db.collection('users').doc(currentUser.uid).collection('tenants').doc(id).delete();
      } catch (err) {
        alert("Error deleting: " + err.message);
      }
    }
  </script>
</body>
</html>
